name: Update Weekly Brief

# Run every Sunday at 10:00 AM Taiwan time (UTC+8 = 02:00 UTC)
on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday 2am UTC = 10am Taiwan
  workflow_dispatch:  # Also allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser requests

      - name: Setup Claude CLI
        run: |
          npm install -g @anthropic-ai/claude-code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate brief
        run: python weekly_brief.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build website
        run: python generate_site.py

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add index.html weekly_brief_*.md raw_news.txt
          git diff --staged --quiet || git commit -m "Update brief: $(date +%Y-%m-%d)"
          git push
